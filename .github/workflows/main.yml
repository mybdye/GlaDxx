# GlaDxx 自动签到工作流
name: GlaDxx Checkin

on:
  # 手动触发
  workflow_dispatch:
  # 定时执行 (UTC时间，对应北京时间上午11:02)
  schedule:
    - cron: '02 3 * * *'
  # 代码推送时触发
  push:
    branches: [ "main" ]

permissions:
  contents: read
  actions: write

concurrency:
  group: glaDxx-checkin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 超时设置
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
      - name: Execute checkin
        env:
          COOKIES: ${{ secrets.COOKIES }}
          BROWSER_UA: ${{ secrets.BROWSER_UA }}
          BARK_TOKEN: ${{ secrets.BARK_TOKEN }}
          PUSHDEER_KEY: ${{ secrets.PUSHDEER_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a python main.py
          else
            python main.py
          fi

      - name: Delete old workflow runs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff=$(date -u -d '7 days ago' +%s)
          gh run list --limit 500 --json databaseId,createdAt \
            --jq ".[] | select((.createdAt | fromdateiso8601) < $cutoff) | .databaseId" \
            | xargs -r -n1 gh run delete
