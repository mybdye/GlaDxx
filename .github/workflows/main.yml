# GlaDxx 自动签到工作流
name: GlaDxx Checkin

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      browser_probe:
        description: '只验证浏览器能否打开签到页'
        type: boolean
        default: false
  # 定时执行 (UTC时间，对应北京时间上午11:02)
  schedule:
    - cron: '02 3 * * *'
  # 代码推送时触发
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # 超时设置
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
      - name: Delete old workflow runs
        uses: MajorScruffy/delete-old-workflow-runs@v0.3.0
        with:
          repository: ${{ github.repository }}   # replace this with your own repository such as >> owner/repo
          older-than-seconds: 604800          # remove all workflow runs older than 1 day >> 24*60*60=86400
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Execute checkin
        env:
          COOKIES: ${{ secrets.COOKIES }}
          BROWSER_UA: ${{ secrets.BROWSER_UA }}
          BARK_TOKEN: ${{ secrets.BARK_TOKEN }}
          PUSHDEER_KEY: ${{ secrets.PUSHDEER_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          BROWSER_PROBE: ${{ inputs.browser_probe }}
        run: |
          if [ "$BROWSER_PROBE" = "true" ]; then
            if command -v xvfb-run >/dev/null 2>&1; then
              xvfb-run -a python -c "import main; print(main.browser_checkin(main.COOKIES.splitlines()[0], main.DEFAULT_USER_AGENT))"
            else
              python -c "import main; print(main.browser_checkin(main.COOKIES.splitlines()[0], main.DEFAULT_USER_AGENT))"
            fi
          elif command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a python main.py
          else
            python main.py
          fi
